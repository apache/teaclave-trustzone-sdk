name: "[Workflow Call]Build Test Qemu Image"

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      guest-arch:
        description: 'QEMU guest architecture: aarch64 or arm32'
        required: true
        type: string
      optee-version:
        description: 'OP-TEE version tag to sync (e.g. 4.11.0)'
        required: true
        type: string

defaults:
  run:
    shell: bash

env:
  BUILD_FOLDER: /tmp/${{ inputs.guest-arch == 'arm32' && 'qemu-arm32' || 'qemuv8' }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Cleanup unused packages to free disk space
        run: |
          echo "Removing top large packages"
          packages=(
            google-chrome-stable microsoft-edge-stable firefox
            azure-cli google-cloud-cli kubectl podman skopeo buildah snapd
            temurin-8-jdk temurin-11-jdk temurin-17-jdk temurin-21-jdk
            dotnet-sdk-8.0 dotnet-runtime-8.0 aspnetcore-runtime-8.0 aspnetcore-targeting-pack-8.0 netstandard-targeting-pack-2.1-8.0 dotnet-targeting-pack-8.0
            llvm-16-dev llvm-17-dev llvm-18-dev
            clang-tools-16 clang-tools-17 clang-tools-18
            clang-tidy-16 clang-tidy-17 clang-tidy-18
          )
          for pkg in "${packages[@]}"; do
              if dpkg-query -W -f='${Package}\n' $pkg 2>/dev/null | grep -q .; then
                  echo "Package $pkg exists, removing..."
                  sudo apt-get remove -y --purge --allow-change-held-packages --allow-remove-essential --no-install-recommends $pkg || true
              else
                  echo "Package $pkg not found, skipping."
              fi
          done
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true

          echo "Removing heavy preinstalled SDKs..."
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache
          
          echo "Disk usage after cleanup:"
          df -h
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ccache
            # cache build tool cache, helpful on arm64 host
            ${{ env.BUILD_FOLDER }}/out-aarch64-sdk
            ${{ env.BUILD_FOLDER }}/toolchains
          key: builds-cache-${{ runner.arch }}-${{ inputs.guest-arch }}-${{ github.sha }}
          restore-keys: |
            builds-cache-${{ runner.arch }}-${{ inputs.guest-arch }}-

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install OP-TEE dependencies
        run: |
          sudo ./setup_optee_dependencies.sh
          
      - name: Checkout OP-TEE repository
        run: |
          mkdir -p ${{ env.BUILD_FOLDER }} &&
          cd ${{ env.BUILD_FOLDER }} &&
          repo init -u https://github.com/OP-TEE/manifest.git \
            -m ${{ inputs.guest-arch == 'arm32' && 'default.xml' || 'qemu_v8.xml' }} \
            -b ${{ inputs.optee-version }} &&
          repo sync -j4 --no-clone-bundle

      - name: Get Output Name
        id: output_name
        run: |
          OPTEE_TAG=optee-${{ inputs.optee-version }}
          OS_VERSION_TAG="ubuntu-24.04"
          ARCH_TAG=$(uname -m)
          PLATFORM_TAG=${{ inputs.guest-arch == 'arm32' && 'qemu-arm32' || 'qemuv8' }}
          OUTPUT_NAME=$ARCH_TAG-$OPTEE_TAG-$PLATFORM_TAG-$OS_VERSION_TAG-expand-ta-memory

          echo "name=$OUTPUT_NAME" > $GITHUB_OUTPUT

      - name: Apply patches for Disabling WatchDog Test
        if: ${{ inputs.guest-arch != 'arm32' }}
        run: |
          (cd ${{ env.BUILD_FOLDER }}/build && git apply $GITHUB_WORKSPACE/.patches/test_qemu/optee-build_disable_wd_test.patch)

      - name: Apply patches to expand memory
        run: |
          (cd ${{ env.BUILD_FOLDER }}/qemu && git apply $GITHUB_WORKSPACE/.patches/test_qemu/qemu-qemu_expand_secure_memory.patch)
          (cd ${{ env.BUILD_FOLDER }}/trusted-firmware-a && git apply $GITHUB_WORKSPACE/.patches/test_qemu/arm-atf_expand_secure_memory.patch)

      - name: Apply patches to enable ssh
        run: |
          (cd ${{ env.BUILD_FOLDER }}/build && git apply $GITHUB_WORKSPACE/.patches/test_qemu/optee-build_enable_ssh.patch)

      - name: Apply patch for the user VA range overflow
        run: |
          (cd ${{ env.BUILD_FOLDER }}/optee_os && git apply $GITHUB_WORKSPACE/.patches/test_qemu/optee-os_user_va_range_overflow.patch)
      # cd to the output folder first to avoid extra path in the tar file.
      - name: Build And Pack
        env:
          OUTPUT_NAME: ${{ steps.output_name.outputs.name }}
          OUTPUT_FOLDER: /tmp/${{ steps.output_name.outputs.name }}
          GUEST_ARCH: ${{ inputs.guest-arch }}
        run: |
          cd ${{ env.BUILD_FOLDER }}
          cd build
          make toolchains -j"$(nproc)"

          EXPAND_FLAGS=(
            CFG_TZDRAM_SIZE=0x01f00000
            CFG_PGT_CACHE_ENTRIES=32
            CFG_WITH_LPAE=y
            CFG_CORE_PREALLOC_EL0_TBLS=y
          )
          make all -j"$(nproc)" "${EXPAND_FLAGS[@]}"

          mkdir -p ${{ env.OUTPUT_FOLDER }}
          cp ${{ env.BUILD_FOLDER }}/out/bin/* ${{ env.OUTPUT_FOLDER }}
          if [ "$GUEST_ARCH" = "arm32" ]; then
            # qemu.mk does not link the rootfs into out/bin.
            cp ${{ env.BUILD_FOLDER }}/out-br/images/rootfs.cpio.gz ${{ env.OUTPUT_FOLDER }}
            QEMU_BINARY=$(find ${{ env.BUILD_FOLDER }}/qemu/build -maxdepth 2 -name qemu-system-arm -type f | head -n 1)
          else
            QEMU_BINARY=$(find ${{ env.BUILD_FOLDER }}/qemu/build -maxdepth 2 -name qemu-system-aarch64 -type f | head -n 1)
          fi
          test -n "$QEMU_BINARY"
          cp "$QEMU_BINARY" ${{ env.OUTPUT_FOLDER }}

          mkdir -p $GITHUB_WORKSPACE/out
          cd ${{ env.OUTPUT_FOLDER }}
          cd ..
          tar -czvf $GITHUB_WORKSPACE/out/${{ env.OUTPUT_NAME }}.tar.gz ${{ env.OUTPUT_NAME }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.output_name.outputs.name }}
          path: |
            out/*
          if-no-files-found: error
