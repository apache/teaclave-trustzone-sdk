name: "[Workflow Call]Test in OP-TEE Repo"

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      container:
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  # Cross-compile the examples inside the OP-TEE tree and run the QEMU check
  # script from the OP-TEE repo. The 32-bit variant runs 32-bit CAs and TAs.
  OPTEE-repo-build-and-run-examples:
    name: OPTEE-repo-build-and-run-examples-${{ matrix.tas }}-TAs
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container }}
    strategy:
      fail-fast: false
      matrix:
        tas: [64bit, 32bit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: 'teaclave-trustzone-sdk'
      - name: Checkout OP-TEE repository
        run: |
          mkdir -p ~/optee-qemuv8 && cd ~/optee-qemuv8 &&
          repo init -u https://github.com/OP-TEE/manifest.git -m qemu_v8.xml &&
          repo sync -j4 --no-clone-bundle
      - name: Build images and run tests
        env:
          MAKE_ARGS: ${{ matrix.tas == '32bit' && 'COMPILE_S_USER=32' || '' }}
        run: |
          cd ~/optee-qemuv8
          rm -rf optee_rust/ &&
          mv "$GITHUB_WORKSPACE/teaclave-trustzone-sdk" optee_rust/
          cd build &&
          make -j3 toolchains &&
          make -j"$(nproc)" RUST_ENABLE=y DUMP_LOGS_ON_ERROR=1 $MAKE_ARGS check
